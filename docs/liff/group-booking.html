<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>จองหมู่คณะ — ครัวชมพู่ อ่างศิลา</title>
<script src="https://static.line-scdn.net/liff/edge/versions/2.22.3/sdk.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#4dc8f4;--pink:#e6538d;--bg:#f5f8ff;--text:#1a1a2e;--sub:#6b7280;--border:#e5e7eb}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans Thai',sans-serif;background:var(--bg);min-height:100vh;padding-bottom:30px}
.topbar{background:linear-gradient(135deg,var(--blue),var(--pink));color:#fff;padding:16px;text-align:center;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(77,200,244,.3)}
.topbar h1{font-size:18px;font-weight:800}.topbar p{font-size:12px;opacity:.85;margin-top:2px}
.card{background:#fff;border-radius:16px;padding:20px;margin:16px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.card h2{font-size:16px;font-weight:800;color:var(--text);margin-bottom:4px;display:flex;align-items:center;gap:8px}
.card p{font-size:12px;color:var(--sub);margin-bottom:16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--sub);margin-bottom:6px}
.field label span{color:#e74c3c}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:15px;font-family:inherit;color:var(--text);outline:none;transition:.2s;resize:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.menu-opt{border:2px solid var(--border);border-radius:12px;padding:14px 10px;text-align:center;cursor:pointer;transition:.2s}
.menu-opt.selected{border-color:var(--blue);background:#e8f9fe}
.menu-opt .icon{font-size:28px;margin-bottom:4px}
.menu-opt .name{font-size:13px;font-weight:700;color:var(--text)}
.menu-opt .price{font-size:12px;color:var(--pink);font-weight:600}
.btn{width:100%;padding:15px;border:none;border-radius:14px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;transition:.15s}
.btn:active{transform:scale(.97)}
.btn-blue{background:linear-gradient(135deg,var(--blue),#38b2d8);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.success{text-align:center;padding:40px 20px}
.success-icon{font-size:80px;margin-bottom:16px}
.success-title{font-size:22px;font-weight:800;color:var(--blue);margin-bottom:8px}
.success-sub{font-size:14px;color:var(--sub);line-height:1.8}
.booking-id{font-size:13px;background:var(--bg);border-radius:10px;padding:10px 16px;margin-top:12px;color:var(--sub)}
.loading{text-align:center;padding:60px 20px;color:var(--sub)}
.loader{width:40px;height:40px;border:4px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="topbar"><h1>👥 ครัวชมพู่ อ่างศิลา</h1><p>จองหมู่คณะ / อีเวนต์</p></div>
<div id="app"><div class="loading"><div class="loader"></div><p>กำลังโหลด...</p></div></div>

<script>
const GAS_URL = 'YOUR_APPS_SCRIPT_URL';
const LIFF_ID = '2010373258-yUWNKYoz';

let profile = {};
let selectedMenu = 'standard';

async function init() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    profile = await liff.getProfile();
    renderForm();
  } catch(e) {
    document.getElementById('app').innerHTML = '<div class="loading"><p>❌ เกิดข้อผิดพลาด กรุณาปิดแล้วเปิดใหม่</p></div>';
  }
}

const menuOptions = [
  { id:'standard', icon:'🍽', name:'เมนูมาตรฐาน', price:'฿350/ท่าน' },
  { id:'premium',  icon:'🦀', name:'เมนู Premium', price:'฿550/ท่าน' },
  { id:'seafood',  icon:'🦞', name:'ซีฟู้ดเต็มรูปแบบ', price:'฿750/ท่าน' },
  { id:'custom',   icon:'✨', name:'กำหนดเอง', price:'ติดต่อทีม' },
];

function renderForm() {
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('app').innerHTML = `
    <div class="card">
      <h2>👥 จองหมู่คณะ</h2>
      <p>เหมาะสำหรับกลุ่ม 10 ท่านขึ้นไป · งานเลี้ยง · สัมมนา · วันเกิด</p>
      <div class="field"><label>บริษัท / ชื่อกลุ่ม <span>*</span></label>
        <input id="company" type="text" placeholder="เช่น บริษัท ABC จำกัด">
      </div>
      <div class="row2">
        <div class="field"><label>ชื่อผู้ติดต่อ <span>*</span></label>
          <input id="contactName" type="text" placeholder="ชื่อ-นามสกุล" value="${profile.displayName || ''}">
        </div>
        <div class="field"><label>เบอร์โทร <span>*</span></label>
          <input id="phone" type="tel" placeholder="08x-xxx-xxxx">
        </div>
      </div>
      <div class="row2">
        <div class="field"><label>วันที่จัดงาน <span>*</span></label>
          <input id="eventDate" type="date" min="${today}">
        </div>
        <div class="field"><label>จำนวนผู้เข้าร่วม <span>*</span></label>
          <select id="guests">
            <option value="10-20">10–20 ท่าน</option>
            <option value="21-30">21–30 ท่าน</option>
            <option value="31-50">31–50 ท่าน</option>
            <option value="51-100">51–100 ท่าน</option>
            <option value="100+">100+ ท่าน</option>
          </select>
        </div>
      </div>
      <div class="field"><label>เลือกเมนู <span>*</span></label>
        <div class="menu-grid" id="menuGrid">
          ${menuOptions.map(m=>`
            <div class="menu-opt${m.id===selectedMenu?' selected':''}" onclick="selectMenu('${m.id}')">
              <div class="icon">${m.icon}</div>
              <div class="name">${m.name}</div>
              <div class="price">${m.price}</div>
            </div>`).join('')}
        </div>
      </div>
      <div class="field"><label>งบประมาณโดยประมาณ</label>
        <input id="budget" type="text" placeholder="เช่น 30,000 บาท">
      </div>
      <div class="field"><label>รายละเอียดเพิ่มเติม</label>
        <textarea id="notes" rows="3" placeholder="ความต้องการพิเศษ, ธีมงาน, อุปกรณ์ที่ต้องการ..."></textarea>
      </div>
      <button class="btn btn-blue" onclick="submit()">📋 ส่งใบจอง</button>
    </div>`;
}

function selectMenu(id) {
  selectedMenu = id;
  document.querySelectorAll('.menu-opt').forEach(el => el.classList.remove('selected'));
  event.currentTarget.classList.add('selected');
}

async function submit() {
  const company     = document.getElementById('company').value.trim();
  const contactName = document.getElementById('contactName').value.trim();
  const phone       = document.getElementById('phone').value.trim();
  const eventDate   = document.getElementById('eventDate').value;
  if (!company || !contactName || !phone || !eventDate) { alert('กรุณากรอกข้อมูลที่จำเป็นให้ครบ'); return; }
  const btn = document.querySelector('.btn');
  btn.disabled = true; btn.textContent = 'กำลังส่งข้อมูล...';
  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({
        type: 'groupbooking',
        lineUserId: profile.userId,
        displayName: profile.displayName,
        company, contactName, phone, eventDate,
        guests: document.getElementById('guests').value,
        menuType: menuOptions.find(m=>m.id===selectedMenu)?.name || selectedMenu,
        budget: document.getElementById('budget').value,
        notes: document.getElementById('notes').value,
      }),
    });
    const data = await res.json();
    renderSuccess(data.id, company, eventDate);
  } catch(e) {
    btn.disabled = false; btn.textContent = '📋 ส่งใบจอง';
    alert('เกิดข้อผิดพลาด กรุณาลองใหม่');
  }
}

function renderSuccess(id, company, date) {
  document.getElementById('app').innerHTML = `
    <div class="success">
      <div class="success-icon">🎉</div>
      <div class="success-title">ส่งใบจองสำเร็จ!</div>
      <div class="success-sub">
        ${company}<br>📅 ${date}<br>
        ทีมงานจะติดต่อกลับภายใน 24 ชม.
      </div>
      <div class="booking-id">รหัส: ${id}</div>
    </div>`;
}

init();
</script>
</body>
</html>
