<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>รีวิว — ครัวชมพู่ อ่างศิลา</title>
<script src="https://static.line-scdn.net/liff/edge/versions/2.22.3/sdk.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#4dc8f4;--pink:#e6538d;--gold:#f59e0b;--bg:#f5f8ff;--text:#1a1a2e;--sub:#6b7280;--border:#e5e7eb}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans Thai',sans-serif;background:var(--bg);min-height:100vh;padding-bottom:40px}
.topbar{background:linear-gradient(135deg,var(--blue),var(--pink));color:#fff;padding:16px;text-align:center;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(77,200,244,.3)}
.topbar h1{font-size:18px;font-weight:800}.topbar p{font-size:12px;opacity:.85;margin-top:2px}
.card{background:#fff;border-radius:16px;padding:20px;margin:16px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.section-label{font-size:13px;font-weight:700;color:var(--sub);margin-bottom:10px}
/* Stars */
.stars-row{display:flex;justify-content:center;gap:8px;margin:4px 0 16px}
.star{font-size:42px;cursor:pointer;opacity:.3;transition:.15s;user-select:none;-webkit-user-select:none}
.star.active{opacity:1;transform:scale(1.05)}
.rating-label{text-align:center;font-size:14px;font-weight:700;color:var(--text);margin-bottom:4px;min-height:20px}
/* Category chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{padding:7px 14px;border-radius:100px;border:1.5px solid var(--border);font-size:12px;font-weight:600;cursor:pointer;color:var(--sub);font-family:inherit;background:#fff;transition:.15s}
.chip.selected{border-color:var(--blue);background:var(--blue);color:#fff}
textarea{width:100%;padding:14px;border:1.5px solid var(--border);border-radius:12px;font-size:14px;font-family:inherit;color:var(--text);outline:none;resize:none;transition:.2s;line-height:1.5}
textarea:focus{border-color:var(--blue)}
.char-count{text-align:right;font-size:11px;color:var(--sub);margin-top:4px}
.pts-hint{background:#fef9e7;border:1.5px solid #fde68a;border-radius:10px;padding:12px 16px;font-size:12px;color:#92400e;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.btn{width:100%;padding:15px;border:none;border-radius:14px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;transition:.15s}
.btn:active{transform:scale(.97)}
.btn-blue{background:linear-gradient(135deg,var(--blue),#38b2d8);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* Success */
.success-screen{text-align:center;padding:40px 20px}
.success-icon{font-size:72px;margin-bottom:16px;animation:pop .4s}
@keyframes pop{0%{transform:scale(0)}80%{transform:scale(1.1)}100%{transform:scale(1)}}
.success-title{font-size:22px;font-weight:800;color:var(--text);margin-bottom:8px}
.success-sub{font-size:14px;color:var(--sub);line-height:1.6;margin-bottom:24px}
.pts-earned{background:linear-gradient(135deg,var(--gold),#d97706);color:#fff;border-radius:14px;padding:16px;font-size:20px;font-weight:800;margin-bottom:20px}
.loading{text-align:center;padding:60px 20px;color:var(--sub)}
.loader{width:40px;height:40px;border:4px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="topbar"><h1>🦀 ครัวชมพู่ อ่างศิลา</h1><p>รีวิวและให้คะแนน</p></div>
<div id="app">

  <div class="card" style="margin-top:16px">
    <div style="text-align:center;margin-bottom:4px">
      <div style="font-size:13px;color:var(--sub);margin-bottom:4px">ประสบการณ์วันนี้เป็นอย่างไร?</div>
      <div class="rating-label" id="rating-label">แตะดาวเพื่อให้คะแนน</div>
    </div>
    <div class="stars-row" id="stars">
      <span class="star" data-val="1" onclick="setRating(1)">⭐</span>
      <span class="star" data-val="2" onclick="setRating(2)">⭐</span>
      <span class="star" data-val="3" onclick="setRating(3)">⭐</span>
      <span class="star" data-val="4" onclick="setRating(4)">⭐</span>
      <span class="star" data-val="5" onclick="setRating(5)">⭐</span>
    </div>
  </div>

  <div class="card">
    <div class="section-label">หมวดหมู่รีวิว</div>
    <div class="chips">
      <button class="chip selected" onclick="toggleChip(this,'overall')">⭐ ภาพรวม</button>
      <button class="chip" onclick="toggleChip(this,'food')">🍽️ อาหาร</button>
      <button class="chip" onclick="toggleChip(this,'service')">👨‍🍳 บริการ</button>
      <button class="chip" onclick="toggleChip(this,'ambience')">🌳 บรรยากาศ</button>
      <button class="chip" onclick="toggleChip(this,'price')">💰 ราคา</button>
    </div>

    <div class="section-label">เขียนรีวิว</div>
    <textarea id="comment" rows="4" placeholder="เล่าให้เราฟังหน่อยนะ... อาหารเป็นยังไง? บริการโอเคไหม? อยากให้ปรับปรุงอะไรบ้าง?" maxlength="500" oninput="updateChar()"></textarea>
    <div class="char-count"><span id="char-count">0</span>/500</div>
  </div>

  <div style="padding:0 16px 16px">
    <div class="pts-hint">⭐ <span>รีวิวสำเร็จรับ <strong>5 แต้ม</strong> ทันที!</span></div>
    <button class="btn btn-blue" id="submit-btn" onclick="submitReview()" disabled>
      ส่งรีวิว
    </button>
  </div>

</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwqfeB0x6LIYQY_cSnL5_VOqHKyG3WHDf1c5zQOUIizd3tn4CHC7_5jGi2IrcgZvEB10Q/exec';
const LIFF_ID = '2010373258-REVIEW01'; // ← เปลี่ยน LIFF ID จริง
let profile = {}, currentRating = 0, selectedCategory = 'overall';

const RATING_LABELS = ['', '😞 ปรับปรุงได้อีก', '😐 พอใช้ได้', '😊 ดีนะ', '😄 ดีมาก!', '🤩 ยอดเยี่ยมมาก!'];

async function init() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    profile = await liff.getProfile();
  } catch(e) { /* silent */ }
}

function setRating(val) {
  currentRating = val;
  document.querySelectorAll('.star').forEach((s,i) => s.classList.toggle('active', i < val));
  document.getElementById('rating-label').textContent = RATING_LABELS[val];
  checkSubmit();
}

function toggleChip(el, cat) {
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  selectedCategory = cat;
}

function updateChar() {
  const len = document.getElementById('comment').value.length;
  document.getElementById('char-count').textContent = len;
  checkSubmit();
}

function checkSubmit() {
  const hasRating = currentRating > 0;
  const hasComment = document.getElementById('comment').value.trim().length >= 5;
  document.getElementById('submit-btn').disabled = !(hasRating && hasComment);
}

async function submitReview() {
  const comment = document.getElementById('comment').value.trim();
  if (!comment || !currentRating) return;
  const btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.textContent = 'กำลังส่ง...';

  const res = await post({
    type: 'review_submit',
    lineUserId: profile.userId || 'anonymous',
    displayName: profile.displayName || 'ลูกค้า',
    rating: currentRating,
    comment,
    category: selectedCategory
  });

  document.getElementById('app').innerHTML = `
    <div class="success-screen">
      <div class="success-icon">🎉</div>
      <div class="success-title">ขอบคุณมากนะ!</div>
      <div class="success-sub">รีวิวของคุณช่วยให้เราพัฒนาได้<br>และช่วยลูกค้าท่านอื่นด้วยนะ 💛</div>
      <div class="pts-earned">⭐ +5 แต้ม ได้รับแล้ว!</div>
      <button class="btn btn-blue" onclick="liff.closeWindow()">ปิดหน้านี้</button>
    </div>`;
}

async function post(data) {
  const r = await fetch(GAS_URL, { method:'POST', body: JSON.stringify(data) });
  return r.json();
}

init();
</script>
</body>
</html>
