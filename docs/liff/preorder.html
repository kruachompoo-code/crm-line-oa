<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pre-order / สั่งอาหารล่วงหน้า — ครัวชมพู่ อ่างศิลา</title>
<script src="https://static.line-scdn.net/liff/edge/versions/2.22.3/sdk.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#4dc8f4;--pink:#e6538d;--gold:#f59e0b;--bg:#f5f8ff;--text:#1a1a2e;--sub:#6b7280;--border:#e5e7eb;--green:#10b981}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans Thai',sans-serif;background:var(--bg);min-height:100vh;padding-bottom:40px}
.topbar{background:linear-gradient(135deg deg,var(--blue),var(--pink));color:#fff;padding:16px;text-align:center;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(77,200,244,.3)}
.topbar h1{font-size:18px;font-weight:800}.topbar p{font-size:12px;opacity:.85;margin-top:2px}
.card{background:#fff;border-radius:16px;margin:0 16px 12px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.card-title{font-size:13px;font-weight:700;color:var(--sub);margin-bottom:14px;text-transform:uppercase;letter-spacing:.5px}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:13px;font-weight:700;color:var(--text);margin-bottom:6px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:12px;font-size:14px;font-family:inherit;color:var(--text);outline:none;transition:.2s;background:#fff}
.form-group input:focus,.form-group select:focus{border-color:var(--blue)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.menu-section{margin:0 16px 12px}
.menu-section-title{font-size:14px;font-weight:800;color:var(--text);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.menu-item{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 6px rgba(0,0,0,.06);border:1.5px solid transparent;transition:.15s}
.menu-item.selected{border-color:var(--blue);background:linear-gradient(135deg,rgba(77,200,244,.05),rgba(230,83,141,.05))}
.mi-info{flex:1}
.mi-name{font-size:14px;font-weight:700;color:var(--text)}
.mi-price{font-size:13px;color:var(--pink);font-weight:700;margin-top:2px}
.mi-desc{font-size:11px;color:var(--sub);margin-top:2px;line-height:1.4}
.qty-ctrl{display:flex;align-items:center;gap:8px}
.qty-btn{width:32px;height:32px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--blue),var(--pink));color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.qty-btn.minus{background:#f3f4f6;color:var(--text)}
.qty-num{font-size:16px;font-weight:800;color:var(--text);min-width:20px;text-align:center}
.summary-bar{background:#fff;border-radius:16px;margin:0 16px 12px;padding:16px 20px;box-shadow:0 2px 10px rgba(0,0,0,.07);display:flex;justify-content:space-between;align-items:center}
.sum-label{font-size:13px;color:var(--sub)}
.sum-total{font-size:22px;font-weight:800;color:var(--text)}
.sum-items{font-size:12px;color:var(--sub);margin-top:2px}
.btn-wrap{padding:0 16px 20px}
.btn{width:100%;padding:14px;border:none;border-radius:14px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;transition:.15s;background:linear-gradient(135deg,var(--blue),var(--pink));color:#fff;margin-bottom:10px}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:default}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:#fff;padding:12px 20px;border-radius:50px;font-size:13px;font-weight:700;z-index:999;opacity:0;transition:.3s;white-space:nowrap}
.toast.show{opacity:1}
.success-screen{text-align:center;padding:40px 20px}
.s-icon{font-size:72px;margin-bottom:16px;animation:pop .4s}
@keyframes pop{0%{transform:scale(0)}80%{transform:scale(1.1)}100%{transform:scale(1)}}
.s-title{font-size:22px;font-weight:800;color:var(--text);margin-bottom:8px}
.s-sub{font-size:14px;color:var(--sub);line-height:1.6;margin-bottom:20px}
.order-ref{background:linear-gradient(135deg,var(--blue),var(--pink));color:#fff;border-radius:14px;padding:16px;font-size:18px;font-weight:800;margin-bottom:16px;letter-spacing:2px}
</style>
</head>
<body>
<div class="topbar"><h1>🛵 Pre-order สั่งล่วงหน้า</h1><p>สั่งอาหารล่วงหน้า รับได้ตรงเวลา ไม่ต้องรอ</p></div>

<div id="loading" style="text-align:center;padding:60px 20px">
  <div style="font-size:52px;margin-bottom:16px">📋</div>
  <div style="font-size:16px;font-weight:700;color:var(--text)">กำลังโหลดเมนู...</div>
</div>

<div id="app" style="display:none">
  <!-- ข้อมูลการรับอาหาร -->
  <div class="card" style="margin-top:16px">
    <div class="card-title">📅 นัดรับอาหาร</div>
    <div class="row2">
      <div class="form-group"><label>วันที่รับ *</label>
        <input type="date" id="pickup-date">
      </div>
      <div class="form-group"><label>เวลารับ *</label>
        <input type="time" id="pickup-time" value="12:00">
      </div>
    </div>
    <div class="form-group"><label>ชื่อผู้รับ *</label>
      <input type="text" id="pickup-name" placeholder="ชื่อ-นามสกุล">
    </div>
    <div class="form-group"><label>เบอร์โทรศัพท์ *</label>
      <input type="tel" id="pickup-phone" placeholder="08X-XXX-XXXX">
    </div>
  </div>

  <!-- เมนู -->
  <div class="menu-section">
    <div class="menu-section-title">🍽️ เลือกเมนู</div>
    <div id="menu-list">
      <!-- จะ render จาก GAS หรือใช้ default menu -->
    </div>
  </div>

  <!-- หมายเหตุ -->
  <div class="card">
    <div class="card-title">📝 หมายเหตุ</div>
    <div class="form-group">
      <textarea id="order-note" rows="2" placeholder="ระบุความต้องการพิเศษ / แพ้อาหาร / ปรับรสชาติ..."></textarea>
    </div>
  </div>

  <!-- สรุปยอด -->
  <div class="summary-bar">
    <div>
      <div class="sum-label">ยอดสั่งซื้อรวม</div>
      <div class="sum-items" id="sum-items">0 รายการ</div>
    </div>
    <div class="sum-total" id="sum-total">฿0</div>
  </div>

  <div class="btn-wrap">
    <button class="btn" id="order-btn" onclick="submitOrder()">🛵 ยืนยันการสั่งอาหารล่วงหน้า</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const LIFF_ID = '2010373258-PREORDER01';
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwqfeB0x6LIYQYy_cSnL5_VOqHKyG3WHDf1c5zQOUIizd3tn4CHC7_5jGi2IrcgZvEB10Q/exec';
let profile = {}, cart = {}, menuItems = [];

const DEFAULT_MENU = [
  { id:'m1', name:'กุ้งแม่น้ำเผาชมพู่อ่างศิลา', price:280, unit:'ตัว', desc:'กุ้งแม่น้ำสดเผาถ่าน เสิร์ฟพร้อมซอสสูตรเด็ด' },
  { id:'m2', name:'ปูม้านึ่งน้ำปลาหวาน', price:350, unit:'ตัว', desc:'ปูม้าสดนึ่งน้ำปลาหวาน ไข่แน่น' },
  { id:'m3', name:'ปลากะพงทอดน้ำปลา', price:280, unit:'จาน', desc:'ปลากะพงทอดกรอบ ราดน้ำปลาหวานพริกสด' },
  { id:'m4', name:'ต้มยำทะเลรวมมิตร', price:220, unit:'หม้อ', desc:'ต้มยำน้ำข้นรสจัดจ้าน' },
  { id:'m5', name:'ผัดฉ่าทะเลสด', price:180, unit:'จาน', desc:'ผัดฉ่ากะเพราทะเลรสแซ่บ' },
  { id:'m6', name:'ข้าวสวย', price:20, unit:'ถ้วย', desc:'' },
];

async function init() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    profile = await liff.getProfile();
  } catch(e) {}

  // ตั้งวันที่ default = วันพรุ่งนี้
  const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate()+1);
  document.getElementById('pickup-date').value = tomorrow.toISOString().split('T')[0];
  document.getElementById('pickup-date').min = new Date().toISOString().split('T')[0];

  // โหลดเมนูจาก GAS หรือใช้ default
  try {
    const res = await fetch(GAS_URL, {
      method:'POST',
      body: JSON.stringify({ type:'get_menu' })
    }).then(r => r.json());
    if (res?.items?.length > 0) menuItems = res.items;
    else menuItems = DEFAULT_MENU;
  } catch(e) {
    menuItems = DEFAULT_MENU;
  }

  renderMenu();
  document.getElementById('loading').style.display = 'none';
  document.getElementById('app').style.display = 'block';
}

function renderMenu() {
  const html = menuItems.map(item => `
    <div class="menu-item" id="item-${item.id}">
      <div class="mi-info">
        <div class="mi-name">${item.name}</div>
        <div class="mi-price">฿${item.price.toLocaleString()} / ${item.unit}</div>
        ${item.desc ? `<div class="mi-desc">${item.desc}</div>` : ''}
      </div>
      <div class="qty-ctrl">
        <button class="qty-btn minus" onclick="changeQty('${item.id}',-1)">−</button>
        <div class="qty-num" id="qty-${item.id}">0</div>
        <button class="qty-btn" onclick="changeQty('${item.id}',1)">+</button>
      </div>
    </div>
  `).join('');
  document.getElementById('menu-list').innerHTML = html;
}

function changeQty(id, delta) {
  cart[id] = Math.max(0, (cart[id] || 0) + delta);
  document.getElementById('qty-'+id).textContent = cart[id];
  const el = document.getElementById('item-'+id);
  el.classList.toggle('selected', cart[id] > 0);
  updateSummary();
}

function updateSummary() {
  let total = 0, count = 0;
  menuItems.forEach(item => {
    const q = cart[item.id] || 0;
    total += q * item.price;
    count += q;
  });
  document.getElementById('sum-total').textContent = '฿' + total.toLocaleString();
  document.getElementById('sum-items').textContent = count + ' รายการ';
}

async function submitOrder() {
  const date = document.getElementById('pickup-date').value;
  const time = document.getElementById('pickup-time').value;
  const name = document.getElementById('pickup-name').value.trim();
  const phone = document.getElementById('pickup-phone').value.trim();
  if (!date || !time) { alert('กรุณาระบุวันและเวลารับอาหาร'); return; }
  if (!name) { alert('กรุณาระบุชื่อผู้รับ'); return; }
  if (!phone) { alert('กรุณาระบุเบอร์โทรศัพท์'); return; }
  const items = menuItems.filter(i => (cart[i.id]||0) > 0).map(i => ({
    name: i.name, qty: cart[i.id], price: i.price, unit: i.unit
  }));
  if (!items.length) { alert('กรุณาเลือกเมนูอย่างน้อย 1 รายการ'); return; }

  const btn = document.getElementById('order-btn');
  btn.disabled = true; btn.textContent = 'กำลังส่งคำสั่ง...';

  const total = items.reduce((s,i) => s + i.qty*i.price, 0);
  const res = await fetch(GAS_URL, {
    method:'POST',
    body: JSON.stringify({
      type:'submit_preorder',
      lineUserId: profile.userId || 'anonymous',
      displayName: profile.displayName || '',
      pickupDate: date, pickupTime: time,
      name, phone,
      items, total,
      note: document.getElementById('order-note').value.trim()
    })
  }).then(r => r.json()).catch(() => ({}));

  const ref = res?.orderRef || 'PO-' + Date.now().toString().slice(-6);
  document.getElementById('app').innerHTML = `
    <div class="success-screen">
      <div class="s-icon">🎉</div>
      <div class="s-title">สั่งอาหารสำเร็จ!</div>
      <div class="s-sub">ทีมงานครัวชมพู่ฯ รับทราบออเดอร์ของคุณแล้ว<br>เราจะเตรียมอาหารให้พร้อมตามเวลาที่นัด 🍽️</div>
      <div class="order-ref">รหัสออเดอร์: ${ref}</div>
      <div style="font-size:13px;color:var(--sub);margin-bottom:20px">รับอาหาร: ${date} เวลา ${time} น.<br>ยอดรวม: ฿${total.toLocaleString()}</div>
      <button class="btn" onclick="liff.closeWindow()">กลับหน้าหลัก</button>
    </div>`;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

init();
</script>
</body>
</html>
