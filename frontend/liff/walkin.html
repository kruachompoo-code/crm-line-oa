<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สั่งอาหาร — ครัวชมพู่ อ่างศิลา</title>
<script src="https://static.line-scdn.net/liff/edge/versions/2.22.3/sdk.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#4dc8f4;--pink:#e6538d;--bg:#f5f8ff;--text:#1a1a2e;--sub:#6b7280;--border:#e5e7eb}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans Thai',sans-serif;background:var(--bg);min-height:100vh}
.topbar{background:linear-gradient(135deg,var(--blue),var(--pink));color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(77,200,244,.3)}
.topbar-left h1{font-size:16px;font-weight:800}.topbar-left p{font-size:11px;opacity:.85;margin-top:1px}
.table-badge{background:rgba(255,255,255,.25);padding:5px 12px;border-radius:20px;font-size:13px;font-weight:700}
.cat-bar{display:flex;gap:8px;padding:10px 14px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:58px;z-index:99;scrollbar-width:none}
.cat-bar::-webkit-scrollbar{display:none}
.cat-btn{padding:6px 16px;border:1.5px solid var(--border);border-radius:20px;font-size:13px;background:#fff;cursor:pointer;white-space:nowrap;font-weight:600;flex-shrink:0;transition:.2s}
.cat-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.quick-actions{display:flex;gap:10px;padding:12px 14px;background:#fff;border-bottom:1px solid var(--border)}
.qa-btn{flex:1;padding:11px 8px;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:.15s;font-family:inherit}
.qa-btn:active{transform:scale(.96)}
.qa-call{background:var(--blue);color:#fff}
.qa-bill{background:var(--pink);color:#fff}
.menu-grid{padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-bottom:130px}
.menu-card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 8px rgba(0,0,0,.06)}
.menu-img{width:100%;height:112px;object-fit:cover;background:linear-gradient(135deg,#e0f7fe,#fce4ec);display:flex;align-items:center;justify-content:center;font-size:42px}
.menu-body{padding:10px}
.menu-name{font-size:14px;font-weight:700;color:var(--text);margin-bottom:2px;line-height:1.3}
.menu-desc{font-size:11px;color:#aaa;margin-bottom:6px;line-height:1.4}
.menu-footer{display:flex;align-items:center;justify-content:space-between}
.menu-price{font-size:15px;font-weight:800;color:var(--pink)}
.qty-ctrl{display:flex;align-items:center;gap:6px}
.qty-btn{width:28px;height:28px;border-radius:50%;border:2px solid var(--blue);background:#fff;color:var(--blue);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:800;line-height:1;transition:.15s}
.qty-btn.add{background:var(--blue);color:#fff}
.qty-btn:active{transform:scale(.9)}
.qty-num{font-size:14px;font-weight:800;min-width:18px;text-align:center;color:var(--text)}
.sold-out{font-size:11px;color:#e74c3c;font-weight:700}
.cart-bar{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(135deg,var(--pink),#c2185b);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 -2px 16px rgba(230,83,141,.35)}
.cart-info{color:#fff}.cart-count{font-size:12px;opacity:.85}.cart-total{font-size:22px;font-weight:800}
.cart-btn{background:#fff;color:var(--pink);border:none;padding:12px 22px;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;transition:.15s}
.cart-btn:disabled{opacity:.5;cursor:not-allowed}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:.25s}
.modal.open{opacity:1;pointer-events:all}
.modal-box{background:#fff;border-radius:24px 24px 0 0;padding:24px;width:100%;max-height:85vh;overflow-y:auto;transform:translateY(40px);transition:.25s}
.modal.open .modal-box{transform:translateY(0)}
.modal-title{font-size:18px;font-weight:800;margin-bottom:16px;color:var(--pink)}
.order-item{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:14px}
.order-item-name{flex:1;color:var(--text)}.order-item-price{font-weight:700;color:var(--pink)}
.summary-row{display:flex;justify-content:space-between;padding:8px 0;font-size:15px;color:var(--sub)}
.summary-row.total{font-size:19px;font-weight:800;color:var(--pink);border-top:2px solid var(--pink);margin-top:8px;padding-top:12px}
.confirm-btn{width:100%;padding:15px;background:linear-gradient(135deg,var(--blue),var(--pink));color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:800;margin-top:16px;cursor:pointer;font-family:inherit}
.confirm-btn:disabled{opacity:.5;cursor:not-allowed}
.notes-input{width:100%;padding:10px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;margin-top:12px;resize:none;font-family:inherit}
.notes-input:focus{outline:none;border-color:var(--blue)}
.success-screen{text-align:center;padding:48px 24px}
.success-icon{font-size:72px;margin-bottom:16px}
.success-title{font-size:22px;font-weight:800;color:var(--pink);margin-bottom:8px}
.success-sub{font-size:14px;color:var(--sub);line-height:1.6}
.order-num{font-size:28px;font-weight:800;color:var(--blue);margin:16px 0}
.more-btn{width:100%;padding:14px;background:var(--blue);color:#fff;border:none;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;margin-top:12px;font-family:inherit}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:#333;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;opacity:0;transition:.3s;pointer-events:none;z-index:300;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.loading{text-align:center;padding:60px 20px;color:var(--sub)}
.loader{width:40px;height:40px;border:4px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"><div class="loading"><div class="loader"></div><p>กำลังโหลด...</p></div></div>
<div class="toast" id="toast"></div>
<script>
const API='/api';
let tableNumber='',branchId='',lineUserId='',orderId=null,cart={};

function showToast(msg,dur=2500){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),dur);
}
async function callAPI(method,path,body){
  const token=localStorage.getItem('liff_token')||'';
  const res=await fetch(API+path,{method,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:body?JSON.stringify(body):undefined});
  return res.json();
}

async function init(){
  const params=new URLSearchParams(location.search);
  tableNumber=params.get('table')||'1';
  branchId=params.get('branch')||'1';
  try{
    await liff.init({liffId:window.__LIFF_WALKIN__||'PLACEHOLDER_WALKIN_LIFF_ID'});
    if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return;}
    const profile=await liff.getProfile();
    lineUserId=profile.userId;
    const res=await callAPI('POST','/bookings/walkin',{lineUserId,tableNumber,branchId});
    if(res.id||res.orderId) orderId=res.id||res.orderId;
  }catch(e){console.warn('LIFF init failed, running in preview mode')}
  renderMain();
}

async function renderMain(){
  let items=sampleMenu();
  try{
    const menuData=await callAPI('GET','/bookings/menu?branchId='+branchId);
    if(menuData.items?.length) items=menuData.items;
  }catch(e){}
  const categories=[...new Set(items.map(m=>m.category))];
  document.getElementById('app').innerHTML=`
    <div class="topbar">
      <div class="topbar-left"><h1>🦀 ครัวชมพู่ อ่างศิลา</h1><p>สั่งอาหารออนไลน์</p></div>
      <div class="table-badge">โต๊ะ ${tableNumber}</div>
    </div>
    <div class="cat-bar" id="catBar">
      <button class="cat-btn active" onclick="filterCat('all',this)">ทั้งหมด</button>
      ${categories.map(c=>`<button class="cat-btn" onclick="filterCat('${c}',this)">${c}</button>`).join('')}
    </div>
    <div class="quick-actions">
      <button class="qa-btn qa-call" onclick="callStaff()">🔔 เรียกพนักงาน</button>
      <button class="qa-btn qa-bill" onclick="requestBill()">🧾 เช็คบิล</button>
    </div>
    <div class="menu-grid" id="menuGrid">${items.map(renderMenuCard).join('')}</div>
    <div class="cart-bar">
      <div class="cart-info">
        <div class="cart-count" id="cartCount">0 รายการ</div>
        <div class="cart-total" id="cartTotal">฿0</div>
      </div>
      <button class="cart-btn" id="cartBtn" onclick="openCart()" disabled>ดูรายการ</button>
    </div>
    <div class="modal" id="cartModal"><div class="modal-box" id="cartBox"></div></div>`;
  window._menuItems=items;
  updateCartUI();
}

function renderMenuCard(item){
  if(item.available===false) return `<div class="menu-card"><div class="menu-img">${item.emoji||'🍽️'}</div><div class="menu-body"><div class="menu-name">${item.name}</div><div class="menu-footer"><span class="sold-out">หมดชั่วคราว</span></div></div></div>`;
  return `<div class="menu-card" id="card_${item.id}"><div class="menu-img">${item.emoji||'🍽️'}</div><div class="menu-body"><div class="menu-name">${item.name}</div><div class="menu-desc">${item.description||''}</div><div class="menu-footer"><span class="menu-price">฿${item.price.toLocaleString('th-TH')}</span><div class="qty-ctrl"><button class="qty-btn" onclick="changeQty('${item.id}',-1)">−</button><span class="qty-num" id="qty_${item.id}">0</span><button class="qty-btn add" onclick="changeQty('${item.id}',1)">+</button></div></div></div></div>`;
}

function filterCat(cat,btn){
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const items=window._menuItems||[];
  const grid=document.getElementById('menuGrid');
  grid.innerHTML=(cat==='all'?items:items.filter(m=>m.category===cat)).map(renderMenuCard).join('');
  Object.keys(cart).forEach(id=>{const el=document.getElementById('qty_'+id);if(el)el.textContent=cart[id].qty;});
}

function changeQty(itemId,delta){
  const item=(window._menuItems||[]).find(m=>String(m.id)===String(itemId));
  if(!item)return;
  if(!cart[itemId])cart[itemId]={...item,qty:0};
  cart[itemId].qty=Math.max(0,cart[itemId].qty+delta);
  if(cart[itemId].qty===0)delete cart[itemId];
  const el=document.getElementById('qty_'+itemId);
  if(el)el.textContent=cart[itemId]?.qty||0;
  updateCartUI();
}

function updateCartUI(){
  const items=Object.values(cart);
  const count=items.reduce((s,i)=>s+i.qty,0);
  const total=items.reduce((s,i)=>s+i.qty*i.price,0);
  document.getElementById('cartCount').textContent=`${count} รายการ`;
  document.getElementById('cartTotal').textContent=`฿${total.toLocaleString('th-TH')}`;
  const btn=document.getElementById('cartBtn');
  if(btn)btn.disabled=count===0;
}

function openCart(){
  const items=Object.values(cart);
  const total=items.reduce((s,i)=>s+i.qty*i.price,0);
  document.getElementById('cartBox').innerHTML=`
    <div class="modal-title">🛒 รายการสั่งอาหาร</div>
    ${items.map(i=>`<div class="order-item"><span class="order-item-name">${i.name} × ${i.qty}</span><span class="order-item-price">฿${(i.qty*i.price).toLocaleString('th-TH')}</span></div>`).join('')}
    <div class="summary-row total"><span>รวม</span><span>฿${total.toLocaleString('th-TH')}</span></div>
    <textarea class="notes-input" id="notes" rows="2" placeholder="หมายเหตุ (แพ้อาหาร, เผ็ดน้อย ฯลฯ)"></textarea>
    <button class="confirm-btn" onclick="submitOrder()">✅ ยืนยันสั่งอาหาร</button>
    <button onclick="closeCart()" style="width:100%;padding:12px;background:none;border:none;color:#aaa;font-size:14px;cursor:pointer;margin-top:8px;font-family:inherit">ยกเลิก</button>`;
  document.getElementById('cartModal').classList.add('open');
}
function closeCart(){document.getElementById('cartModal').classList.remove('open');}

async function submitOrder(){
  const notes=document.getElementById('notes').value;
  const items=Object.values(cart).map(i=>({menuItemId:i.id,name:i.name,quantity:i.qty,unitPrice:i.price}));
  const btn=document.querySelector('.confirm-btn');
  btn.disabled=true;btn.textContent='กำลังส่ง...';
  try{
    const res=await callAPI('POST',`/bookings/walkin/${orderId}/items`,{items,notes});
    if(res.error)throw new Error(res.error);
    closeCart();cart={};
    showSuccess(res);
  }catch(e){showToast('❌ เกิดข้อผิดพลาด: '+e.message);btn.disabled=false;btn.textContent='✅ ยืนยันสั่งอาหาร';}
}

function showSuccess(res){
  document.getElementById('app').innerHTML=`
    <div class="success-screen">
      <div class="success-icon">🎉</div>
      <div class="success-title">ส่งออเดอร์แล้ว!</div>
      <div class="success-sub">ครัวชมพู่ อ่างศิลา กำลังเตรียมอาหาร<br>โต๊ะ ${tableNumber} ประมาณ 15–20 นาที</div>
      <div class="order-num">#${res.orderNumber||orderId||'—'}</div>
      <button class="more-btn" onclick="renderMain()">+ สั่งเพิ่ม</button>
      <div style="margin-top:16px;display:flex;gap:10px">
        <button class="qa-btn qa-call" style="flex:1;padding:12px;border-radius:12px;font-family:inherit" onclick="callStaff()">🔔 เรียกพนักงาน</button>
        <button class="qa-btn qa-bill" style="flex:1;padding:12px;border-radius:12px;font-family:inherit" onclick="requestBill()">🧾 เช็คบิล</button>
      </div>
    </div>`;
}

async function callStaff(){
  if(!orderId){showToast('กรุณาสั่งอาหารก่อน');return;}
  showToast('📡 กำลังส่งสัญญาณ...');
  try{await callAPI('POST',`/bookings/walkin/${orderId}/call-staff`,{});showToast('✅ เรียกพนักงานแล้ว รอสักครู่!',3000);}
  catch(e){showToast('❌ '+e.message);}
}

async function requestBill(){
  if(!orderId){showToast('ยังไม่มีออเดอร์');return;}
  showToast('📡 ส่งคำขอเช็คบิล...');
  try{
    const res=await callAPI('POST',`/bookings/walkin/${orderId}/request-bill`,{});
    if(res.qrDataUrl){
      document.getElementById('cartBox').innerHTML=`
        <div class="modal-title">🧾 เช็คบิล</div>
        <p style="font-size:14px;color:#666;margin-bottom:16px">พนักงานจะมาสแกน QR เพื่อยืนยันก่อนรับเงิน</p>
        <img src="${res.qrDataUrl}" style="width:200px;display:block;margin:0 auto 16px;border-radius:12px" alt="verify QR"/>
        <button onclick="closeCart()" style="width:100%;padding:12px;background:none;border:none;color:#aaa;font-size:14px;cursor:pointer;font-family:inherit">ปิด</button>`;
      document.getElementById('cartModal').classList.add('open');
    }
    showToast('✅ ส่งคำขอแล้ว พนักงานกำลังมา',3000);
  }catch(e){showToast('❌ '+e.message);}
}

function sampleMenu(){return[
  {id:1,name:'ปูผัดผงกะหรี่',description:'ปูสดจากอ่างศิลา',price:320,category:'เมนูปู',emoji:'🦀',available:true},
  {id:2,name:'ปูนึ่ง (ตัว)',description:'ปูสดนึ่งกินกับน้ำจิ้ม',price:280,category:'เมนูปู',emoji:'🦀',available:true},
  {id:3,name:'หอยนางรม',description:'สดจากทะเล',price:180,category:'อาหารทะเล',emoji:'🦪',available:true},
  {id:4,name:'กุ้งทอดกระเทียม',description:'กุ้งสดทอดกระเทียมพริกไทย',price:220,category:'อาหารทะเล',emoji:'🍤',available:true},
  {id:5,name:'ต้มยำทะเลรวม',description:'ต้มยำร้อนๆ รสจัด',price:199,category:'ต้มยำ/แกง',emoji:'🍲',available:true},
  {id:6,name:'ข้าวสวย',description:'',price:20,category:'ข้าว/เครื่องดื่ม',emoji:'🍚',available:true},
  {id:7,name:'น้ำดื่ม',description:'',price:15,category:'ข้าว/เครื่องดื่ม',emoji:'💧',available:true},
  {id:8,name:'โซดา',description:'',price:25,category:'ข้าว/เครื่องดื่ม',emoji:'🥤',available:true},
];}

window.addEventListener('load',()=>{try{init();}catch(e){tableNumber='1';branchId='1';window._menuItems=sampleMenu();renderMain();}});
</script>
</body>
</html>
