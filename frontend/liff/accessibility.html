<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>โหมดอ่านง่าย (Gen X)</title>
<script src="https://static.line-scdn.net/liff/edge/versions/2.22.3/sdk.js"></script>
<style>
  :root{--font-size:18px;--line-height:1.9;--primary:#1F4E79}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans Thai',sans-serif;font-size:var(--font-size);line-height:var(--line-height);background:#fffef7;padding:20px 16px 40px;color:#222}
  h1{font-size:26px;font-weight:800;color:var(--primary);margin-bottom:6px}
  .sub{font-size:16px;color:#666;margin-bottom:24px}
  .font-ctrl{display:flex;align-items:center;gap:12px;margin-bottom:20px;background:#fff;padding:14px;border-radius:14px;box-shadow:0 1px 6px rgba(0,0,0,.06)}
  .font-btn{width:40px;height:40px;border:2px solid var(--primary);border-radius:10px;background:#fff;color:var(--primary);font-size:20px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .font-label{font-size:14px;color:#888}
  .menu-card{background:#fff;border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 2px 10px rgba(0,0,0,.07)}
  .menu-title{font-size:20px;font-weight:700;color:var(--primary);margin-bottom:6px}
  .menu-desc{color:#555;margin-bottom:12px}
  .menu-price{font-size:22px;font-weight:800;color:#c0392b}
  .menu-img{width:100%;height:160px;object-fit:cover;border-radius:12px;margin-bottom:12px}
  .btn-add{width:100%;padding:14px;background:var(--primary);color:#fff;border:none;border-radius:14px;font-size:18px;font-weight:700;cursor:pointer;margin-top:8px}
  .basket{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#c0392b;color:#fff;border:none;border-radius:30px;padding:14px 28px;font-size:17px;font-weight:700;cursor:pointer;display:none;box-shadow:0 4px 16px rgba(0,0,0,.25)}
  .cat-btns{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:20px}
  .cat-btn{padding:8px 18px;border:2px solid var(--primary);border-radius:20px;background:#fff;color:var(--primary);font-size:16px;cursor:pointer;white-space:nowrap;font-weight:600}
  .cat-btn.active{background:var(--primary);color:#fff}
  .contrast-btn{margin-left:auto;padding:8px 14px;border:2px solid var(--primary);border-radius:10px;background:#fff;color:var(--primary);font-size:14px;cursor:pointer;font-weight:600}
  body.high-contrast{background:#000;color:#fff}
  body.high-contrast .menu-card{background:#111;color:#fff}
  body.high-contrast .btn-add{background:#FFD700;color:#000}
</style>
</head>
<body>
<h1>🍽️ สั่งอาหาร</h1>
<p class="sub">โหมดอ่านง่ายสำหรับทุกท่าน</p>

<div class="font-ctrl">
  <button class="font-btn" onclick="changeFont(-2)">A−</button>
  <button class="font-btn" onclick="changeFont(2)">A+</button>
  <span class="font-label">ขนาดตัวอักษร</span>
  <button class="contrast-btn" onclick="toggleContrast()">🌑 ปรับแสง</button>
</div>

<div class="cat-btns" id="cats">
  <button class="cat-btn active" onclick="filterCat('all',this)">ทั้งหมด</button>
  <button class="cat-btn" onclick="filterCat('appetizer',this)">ของทาน</button>
  <button class="cat-btn" onclick="filterCat('main',this)">จานหลัก</button>
  <button class="cat-btn" onclick="filterCat('drink',this)">เครื่องดื่ม</button>
  <button class="cat-btn" onclick="filterCat('dessert',this)">ของหวาน</button>
</div>

<div id="menu-list"></div>

<button class="basket" id="basket-btn" onclick="checkout()">🛒 ดูตะกร้า (<span id="basket-count">0</span> รายการ)</button>

<script>
const MENU = [
  {id:1,name:'สเต็กเนื้อออสเตรเลีย',desc:'เนื้อวากิวย่างไฟ เสิร์ฟพร้อมซอสพริกไทยดำ',price:389,cat:'main',img:'https://via.placeholder.com/400x160/1F4E79/fff?text=สเต็กเนื้อ'},
  {id:2,name:'ปลาแซลมอนย่าง',desc:'แซลมอนนอร์เวย์สด ราดซอสมิโซบัตเตอร์',price:299,cat:'main',img:'https://via.placeholder.com/400x160/2E86C1/fff?text=แซลมอน'},
  {id:3,name:'สลัดซีฟู้ด',desc:'อาหารทะเลสด ผักกรอบ น้ำสลัดสมุนไพร',price:199,cat:'appetizer',img:'https://via.placeholder.com/400x160/27AE60/fff?text=สลัด'},
  {id:4,name:'ชาเย็นไทย',desc:'ชาไทยเข้มข้น นมสด หวานน้อย',price:89,cat:'drink',img:'https://via.placeholder.com/400x160/E67E22/fff?text=ชาไทย'},
  {id:5,name:'ฝักทองแกงบวช',desc:'ของหวานไทยโบราณ กลิ่นหอมกะทิ',price:79,cat:'dessert',img:'https://via.placeholder.com/400x160/8E44AD/fff?text=ของหวาน'},
  {id:6,name:'ไก่ทอดกระเทียม',desc:'ไก่ชิ้นใหญ่ กระเทียมกรอบ เสิร์ฟพร้อมข้าว',price:149,cat:'main',img:'https://via.placeholder.com/400x160/C0392B/fff?text=ไก่ทอด'},
];
let basket = {}, currentCat = 'all', fontSize = 18;

function render() {
  const items = currentCat==='all' ? MENU : MENU.filter(m=>m.cat===currentCat);
  document.getElementById('menu-list').innerHTML = items.map(m => `
    <div class="menu-card" data-cat="${m.cat}">
      <img class="menu-img" src="${m.img}" alt="${m.name}" loading="lazy">
      <div class="menu-title">${m.name}</div>
      <div class="menu-desc">${m.desc}</div>
      <div class="menu-price">฿${m.price}</div>
      <button class="btn-add" onclick="addToBasket(${m.id})">
        ${basket[m.id] ? `✅ เพิ่มแล้ว (${basket[m.id]} ชิ้น) +เพิ่ม` : '🛒 เพิ่มในตะกร้า'}
      </button>
    </div>`).join('');
  const total = Object.values(basket).reduce((a,b)=>a+b,0);
  document.getElementById('basket-count').textContent = total;
  document.getElementById('basket-btn').style.display = total>0?'block':'none';
}

function addToBasket(id) {
  basket[id] = (basket[id]||0)+1;
  render();
}

function filterCat(cat, el) {
  currentCat = cat;
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  render();
}

function changeFont(delta) {
  fontSize = Math.max(14, Math.min(26, fontSize+delta));
  document.documentElement.style.setProperty('--font-size', fontSize+'px');
}

function toggleContrast() {
  document.body.classList.toggle('high-contrast');
}

async function checkout() {
  const items = Object.entries(basket).map(([id,qty]) => {
    const m = MENU.find(x=>x.id==id);
    return { menuItemId:id, quantity:qty, name:m.name, price:m.price };
  });
  alert(`ยืนยันคำสั่งซื้อ ${Object.values(basket).reduce((a,b)=>a+b,0)} รายการ\nรวม ฿${items.reduce((a,b)=>a+b.price*b.quantity,0)}`);
}

async function init() {
  await liff.init({ liffId: '@@LIFF_ID_ORDER@@' });
  render();
}

init().catch(console.error);
</script>
</body>
</html>
